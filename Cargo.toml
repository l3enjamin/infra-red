[workspace]
resolver = "3"
members = [
    "crates/ir-core",
    "crates/ir-manifest",
    "crates/ir-resolver",
    "crates/ir-store",
    "crates/ir-secrets",
    "crates/ir-targets",
    "crates/ir-runtime",
    "crates/ir-sandbox",
    "crates/ir-acp",
    "crates/ir-mcp-server",
    "crates/infra-red",
    "crates/irx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/l3enjamin/infra-red"

[workspace.dependencies]
# Internal workspace crates
ir-core = { path = "crates/ir-core" }
ir-manifest = { path = "crates/ir-manifest" }
ir-resolver = { path = "crates/ir-resolver" }
ir-store = { path = "crates/ir-store" }
ir-secrets = { path = "crates/ir-secrets" }
ir-targets = { path = "crates/ir-targets" }
ir-runtime = { path = "crates/ir-runtime" }
ir-sandbox = { path = "crates/ir-sandbox" }
ir-acp = { path = "crates/ir-acp" }
ir-mcp-server = { path = "crates/ir-mcp-server" }

# Async, CLI & Observability
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization, Schemas & Errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
thiserror = "2"
anyhow = "1.0"
toml = "0.8"
toml_edit = "0.22"
semver = { version = "1", features = ["serde"] }

# Dependency Solving
pubgrub = "0.4"

# Storage, VCS & Networking
etcetera = "0.11"
reflink-copy = "0.1.31"
gix = "0.90"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11"
tempfile = "3"
url = { version = "2.5", features = ["serde"] }

# Security, Secrets & Process Control
keyring-core = "1.0"
zeroize = { version = "1", features = ["derive"] }
process-wrap = { version = "10.0", features = ["tokio1"] }

# AI Protocols
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
agent-client-protocol = { version = "5.3", features = ["process", "stdio", "schemars"] }
agent-client-protocol-rmcp = "5.3"
agent-client-protocol-http = { version = "5", features = ["client", "server"] }
axum = "0.8"

[workspace.lints.cargo]
# Temporarily allowed while Layer 1-3 skeleton crates contain `todo!("IR-XXX")` stubs.
# Re-enable as "warn" once Phase 1-4 tickets are implemented.
unused_dependencies = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
