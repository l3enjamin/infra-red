name: PR Validation & Cross-Platform CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint-and-architecture:
    name: Lint, Format & Architecture Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify 4-layer acyclic workspace architecture
        run: ./scripts/verify-architecture.sh

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify Rustdoc builds cleanly
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  supply-chain-and-licenses:
    name: Supply-Chain, Licenses & Zero-C Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check advisories, licenses, bans, and sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check --hide-inclusion-graph

  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    needs: [lint-and-architecture, supply-chain-and-licenses]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux sandbox prerequisites (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Run workspace doc tests
        run: cargo test --workspace --doc --locked

      - name: Smoke-test CLI binaries (`ir` and `irx`)
        run: |
          cargo run --locked --bin ir -- --help
          cargo run --locked --bin irx -- --help
