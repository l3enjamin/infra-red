# Supply-chain, license, and pure-Rust zero-C-linking policy for infra-red.
# Run locally with `cargo deny check` or automatically via GitHub Actions.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Transitive chrono dependency via upstream rmcp/ACP SDKs; unmaintained notice only, no security vulnerability" },
]

[licenses]
version = 2
# Keep default builds cleanly dual-licensed MIT OR Apache-2.0 for enterprise static linking.
# File-level MPL-2.0 (e.g., pubgrub) is allowed when consumed unmodified from crates.io.
# LGPL / GPL crates (e.g., hakoniwa) are intentionally omitted from default builds.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Enforce pure-Rust zero-C-linking defaults (use rustls + gix instead of OpenSSL + libgit2).
deny = [
    { crate = "openssl-sys", reason = "Use rustls via reqwest instead of C OpenSSL" },
    { crate = "openssl", reason = "Use rustls instead of C OpenSSL" },
    { crate = "libgit2-sys", reason = "Use pure-Rust gix instead of C libgit2" },
    { crate = "git2", reason = "Use pure-Rust gix instead of C libgit2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
